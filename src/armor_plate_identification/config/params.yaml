test_node_cpp:
  ros__parameters:
    # === 目标颜色 ===
    target_color: "BLUE"
    # === 预处理参数 ===
    threshold_value: 100
    color_threshold: 100
    # === 灯条匹配参数 ===
    max_angle_diff: 15.0
    min_length_ratio: 0.7
    min_x_diff_ratio: 0.75
    max_y_diff_ratio: 1.0
    max_distance_ratio: 0.8
    min_distance_ratio: 0.1
    # === 数字分类器参数 ===
    number_threshold: 0.5
    # === DEBUG ===
    debug_timecontrol: true
    debug_lights: false
    debug_preprocessing: false
    debug_number_classification: false
    stats_interval: 50
    # === 帧调试 ===
    debug_frame: false
    delay_time: 20
    debug_frame_count: 0
    # === 记录模式 ===
    # debug_frame: true
    # delay_time: 0
    # debug_frame_count: 500

armor_plate_identification_node:
  ros__parameters:
    # === 目标颜色 ===
    target_color: "BLUE"
    # === 预处理参数 ===
    threshold_value: 100
    color_threshold: 100
    # === 相机类型 ===
    # 迈德
    # camera_type: "mindvision"
    # exposure_time: 8000.0
    # gain: 8.0
    # mindvision_camera_info_url: "config/mindvision_camera_info.yaml"
    # 大恒
    camera_type: "galaxy"
    exposure_time: 8000.0
    gain: 8.0
    galaxy_camera_info_url: "config/galaxy_camera_info.yaml"
    # === 灯条匹配参数 ===
    max_angle_diff: 15.0
    min_length_ratio: 0.7
    min_x_diff_ratio: 0.75
    max_y_diff_ratio: 1.0
    max_distance_ratio: 0.8
    min_distance_ratio: 0.1
    # === 数字分类器参数 ===
    number_threshold: 0.2
    # === DEBUG ===
    debug_timecontrol: true
    debug_lights: false
    debug_preprocessing: false
    debug_number_classification: false
    delay_time: 0
    stats_interval: 100
